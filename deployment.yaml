apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    first: app
spec: # behaviour of the replica set
  replicas: 3
  selector: # how to identify the pods that belong to this deployment
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec: # behaviour of the pods
      containers:
        - name: nginx-container
          image: nginx:1.25
          ports:
            - containerPort: 80
--- 
apiVersion: v1
Kind: Service
metadata:
  name: my-service
spec:
  selector:
    app: web
  ports:
    - protocol: TCP
      port: 82
      targetPort: 80
  type: ClusterIP